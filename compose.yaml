services:
  ssdv2-webui:
    build: .
    image: ssdv2-webui:dev
    container_name: ssdv2-webui
    restart: unless-stopped

    environment:
      SSDV2_SOURCE: /home/${SSD_USER:-kesurof}/seedbox-compose
      SSDV2_STORAGE: /home/${SSD_USER:-kesurof}/seedbox
      WEBUI_DATA: /data
      WEBUI_ADMIN_USER: ${WEBUI_ADMIN_USER:-admin}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:?WEBUI_ADMIN_PASSWORD est requis}
      COOKIE_SECURE: "false"
      TZ: Europe/Paris

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/${SSD_USER:-kesurof}/seedbox-compose:/home/${SSD_USER:-kesurof}/seedbox-compose
      - /home/${SSD_USER:-kesurof}/seedbox:/home/${SSD_USER:-kesurof}/seedbox
      - webui-data:/data

    ports:
      - "127.0.0.1:8800:8000"

    group_add:
      - "${DOCKER_GID:-1003}"

volumes:
  webui-data:
