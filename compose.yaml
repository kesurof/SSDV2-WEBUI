services:
  ssdv2-webui:
    build: .
    image: ssdv2-webui:dev
    container_name: ssdv2-webui
    restart: unless-stopped

    environment:
      SSDV2_SOURCE: /home/${SSD_USER:-utilisateur}/seedbox-compose
      SSDV2_STORAGE: /home/${SSD_USER:-utilisateur}/seedbox
      SSDV2CTL_PATH: /opt/ssdv2ctl/ssdv2ctl
      HOME: /home/${SSD_USER:-utilisateur}
      PUID: ${SSD_UID:-1000}
      PGID: ${SSD_GID:-1000}
      DOCKER_GID: ${DOCKER_GID:-999}
      BACKUP_DIR: /home/${SSD_USER:-utilisateur}/backup
      ANSIBLE_INVENTORY: /home/${SSD_USER:-utilisateur}/.ansible/inventories/local
      ANSIBLE_VAULT_PASSWORD_FILE: /home/${SSD_USER:-utilisateur}/.vault_pass
      WEBUI_DATA: /data
      WEBUI_ADMIN_USER: ${WEBUI_ADMIN_USER:-admin}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:?WEBUI_ADMIN_PASSWORD est requis}
      COOKIE_SECURE: "false"
      TZ: Europe/Paris

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/local/bin/docker:ro
      - ${SSDV2CTL_DIR:-/home/utilisateur/ssdv2-ctl-dev}:/opt/ssdv2ctl:ro
      - /home/${SSD_USER:-utilisateur}/.config/ssd/env:/home/${SSD_USER:-utilisateur}/.config/ssd/env:ro
      - /home/${SSD_USER:-utilisateur}/.vault_pass:/home/${SSD_USER:-utilisateur}/.vault_pass:ro
      - /home/${SSD_USER:-utilisateur}/.ansible/inventories:/home/${SSD_USER:-utilisateur}/.ansible/inventories
      - /home/${SSD_USER:-utilisateur}/backup:/home/${SSD_USER:-utilisateur}/backup
      - /home/${SSD_USER:-utilisateur}/seedbox-compose:/home/${SSD_USER:-utilisateur}/seedbox-compose
      - /home/${SSD_USER:-utilisateur}/seedbox:/home/${SSD_USER:-utilisateur}/seedbox
      - webui-data:/data

    ports:
      - "127.0.0.1:8800:8000"

    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik_proxy
      traefik.http.routers.ssdv2-webui-rtr.entrypoints: http,https
      traefik.http.routers.ssdv2-webui-rtr.middlewares: chain-oauth2-proxy@file
      traefik.http.routers.ssdv2-webui-rtr.rule: Host(`ssdv2.exemple.tld`)
      traefik.http.routers.ssdv2-webui-rtr.service: ssdv2-webui-svc
      traefik.http.routers.ssdv2-webui-rtr.tls: "true"
      traefik.http.routers.ssdv2-webui-rtr.tls.certresolver: letsencrypt
      traefik.http.services.ssdv2-webui-svc.loadbalancer.server.port: "8000"

    networks:
      - traefik_proxy

    group_add:
      - "${DOCKER_GID:-999}"

volumes:
  webui-data:

networks:
  traefik_proxy:
    external: true
