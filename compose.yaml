# Compose de développement local.
# Le déploiement de référence est l'application SSDV2 `ssdv2webui` (voir README.md).
# Copier .env.example en .env et renseigner les variables (fichier non versionné).
services:
  ssdv2-webui:
    build: .
    image: ssdv2-webui:dev
    container_name: ssdv2-webui
    restart: unless-stopped

    environment:
      HOME: /home/${SSDV2_USER:?définir SSDV2_USER dans .env}
      SSDV2_SOURCE: /home/${SSDV2_USER}/seedbox-compose
      SSDV2_STORAGE: /home/${SSDV2_USER}/seedbox
      BACKUP_DIR: /home/${SSDV2_USER}/backup
      ANSIBLE_INVENTORY: /home/${SSDV2_USER}/.ansible/inventories/local
      ANSIBLE_VAULT_PASSWORD_FILE: /home/${SSDV2_USER}/.vault_pass
      PUID: ${SSDV2_UID:?définir SSDV2_UID dans .env}
      PGID: ${SSDV2_GID:?définir SSDV2_GID dans .env}
      DOCKER_GID: ${DOCKER_GID:?définir DOCKER_GID dans .env}
      TZ: ${TZ:-Europe/Paris}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      WEBUI_DATA: /data
      WEBUI_ADMIN_USER: ${WEBUI_ADMIN_USER:-admin}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:-}
      # Pour tester un ssdv2ctl en cours de développement, décommenter la variable
      # ci-dessous et le montage correspondant plus bas.
      # SSDV2CTL_PATH: /opt/ssdv2ctl/ssdv2ctl

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/${SSDV2_USER}/.config/ssd/env:/home/${SSDV2_USER}/.config/ssd/env:ro
      - /home/${SSDV2_USER}/.vault_pass:/home/${SSDV2_USER}/.vault_pass:ro
      - /home/${SSDV2_USER}/.ansible/inventories:/home/${SSDV2_USER}/.ansible/inventories
      - /home/${SSDV2_USER}/backup:/home/${SSDV2_USER}/backup
      - /home/${SSDV2_USER}/seedbox-compose:/home/${SSDV2_USER}/seedbox-compose
      - /home/${SSDV2_USER}/seedbox:/home/${SSDV2_USER}/seedbox
      # - ${SSDV2CTL_DIR:?définir SSDV2CTL_DIR dans .env}:/opt/ssdv2ctl:ro
      - webui-data:/data

    ports:
      - "127.0.0.1:${WEBUI_PORT:-8800}:8000"

    group_add:
      - "${DOCKER_GID}"

volumes:
  webui-data:
